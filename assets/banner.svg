<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-node-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .floating-node-3 { animation: floatSlow 7s ease-in-out infinite 2s; }
      .pulse-bg { animation: pulseLight 4s ease-in-out infinite; }
      .animated-dash { stroke-dasharray: 8 6; animation: dashMove 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5"/>

  <!-- Ambient Glowing Orbs in Background (behind text) -->
  <circle cx="150" cy="80" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glowSoft)" class="pulse-bg"/>
  <circle cx="1050" cy="260" r="200" fill="#0284c7" opacity="0.15" filter="url(#glowSoft)" class="pulse-bg"/>

  <!-- Subtle Dynamic Tech Grid / Network Lines in Background -->
  <g stroke="url(#accentGrad)" stroke-width="1" opacity="0.25" class="animated-dash">
    <path d="M 50 280 Q 300 200 600 290 T 1150 220" fill="none"/>
    <path d="M 100 60 Q 400 150 750 70 T 1100 120" fill="none"/>
  </g>

  <!-- Dynamic Decorative Nodes (Positioned safely away from center text foreground) -->
  <!-- Top Right Card Floating -->
  <g class="floating-node-1" transform="translate(930, 45)">
    <rect width="210" height="58" rx="12" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="28" cy="29" r="14" fill="#6366f1"/>
    <path d="M 23 29 L 27 33 L 34 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Multi-Channel Cadence</text>
    <text x="52" y="43" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">Email • LinkedIn • Phone</text>
  </g>

  <!-- Bottom Right Card Floating -->
  <g class="floating-node-2" transform="translate(900, 225)">
    <rect width="230" height="60" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#0284c7"/>
    <text x="24" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">⚡</text>
    <text x="54" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Open-Source AI Sales</text>
    <text x="54" y="44" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">Signal • Warmbly • Prospex</text>
  </g>

  <!-- Bottom Left Card Floating -->
  <g class="floating-node-3" transform="translate(60, 230)">
    <rect width="220" height="58" rx="12" fill="#1e1035" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="28" cy="29" r="14" fill="#a855f7"/>
    <text x="22" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13">🚀</text>
    <text x="52" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Automated Outreach</text>
    <text x="52" y="43" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="11">Smart Sequences &amp; CRM</text>
  </g>

  <!-- MAIN FOREGROUND TEXT (CLEAR & UNHEEDED BY DYNAMIC ELEMENTS) -->
  <!-- Category Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="30" rx="15" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="160" y="19" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle" letter-spacing="1">CURATED INSIDE SALES ECOSYSTEM</text>
  </g>

  <!-- Title H1 -->
  <text x="60" y="128" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="-0.5" filter="url(#glow)">Awesome Sales Cadence</text>

  <!-- Subtitle -->
  <text x="60" y="168" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26">&amp; Inside Sales Automation</text>

  <!-- Description line -->
  <text x="60" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="15">Commercial Sales Engagement Platforms, Open-Source Sequence Engines &amp; AI Outreach Tools</text>

  <!-- Bottom Accent Bar -->
  <rect x="60" y="308" width="1080" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
